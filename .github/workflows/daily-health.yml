name: Lovebug Booth - Daily Health

on:
  schedule:
    # 02:17 UTC each day (07:47 Asia/Colombo), away from top-of-hour load.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovebug-daily-health
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase and website; write today's health record
        env:
          HEALTH_TOKEN: ${{ secrets.LOVEBUG_HEALTH_GITHUB_TOKEN }}
          HEALTH_URL: https://cwmsqihdtxsfgmslavpk.supabase.co/functions/v1/lovebug-health?source=github-actions
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HEALTH_TOKEN" ]; then
            echo 'Missing GitHub Actions secret LOVEBUG_HEALTH_GITHUB_TOKEN.' >&2
            exit 1
          fi
          # Never echo request headers, secret values, or credentialed URLs.
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 5 --max-time 30 \
            --request POST \
            --header "x-lovebug-health-token: ${HEALTH_TOKEN}" \
            "$HEALTH_URL"
          echo ''
          echo 'Daily health request completed.'
